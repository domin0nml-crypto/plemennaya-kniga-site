name: Публикация тестовой витрины в Яндекс Cloud

on:
  push:
    branches:
      - codex/yandex-preview

permissions:
  contents: read
  id-token: write

concurrency:
  group: yandex-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Опубликовать и проверить витрину
    if: github.repository == 'domin0nml-crypto/plemennaya-kniga-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BUCKET: breedbook-ru-preview-1457655375
    steps:
      - name: Получить файлы из GitHub
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Подготовить файлы витрины
        shell: bash
        run: |
          preview="$RUNNER_TEMP/breedbook-preview"
          mkdir -p "$preview"
          for page in ./*.html; do
            case "$page" in
              ./google*.html|./yandex_*.html) continue ;;
            esac
            sed '/<head>/a\  <meta name="robots" content="noindex, nofollow">' "$page" > "$preview/${page##*/}"
          done
          cp -- ./*.css ./*.svg "$preview/"
          cp -R -- assets "$preview/"
          printf '%s\n' "$GITHUB_SHA" > "$preview/deploy-version.txt"

      - name: Загрузить файлы в Object Storage
        uses: yc-actions/yc-obj-storage-upload@47e8131e61b8c84857806333bfd8c954506a73f9 # v5
        with:
          yc-sa-id: ajeifmnrldmi8gvn14t5
          bucket: ${{ env.PREVIEW_BUCKET }}
          root: ${{ runner.temp }}/breedbook-preview
          include: '**/*'
          fail-on-error: true

      - name: Проверить опубликованную версию по HTTPS
        shell: bash
        run: |
          preview="$RUNNER_TEMP/breedbook-preview"
          site="https://$PREVIEW_BUCKET.website.yandexcloud.net"
          received="$RUNNER_TEMP/received-site-file"

          for file in deploy-version.txt index.html cats.html dogs.html styles.css assets/cover.webp; do
            url="$site/$file"
            if [[ "$file" == index.html ]]; then
              url="$site/"
            fi
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --max-time 15 --output "$received" "$url?commit=$GITHUB_SHA"
            cmp -- "$preview/$file" "$received"
            printf 'Проверено: %s\n' "$url"
          done

          printf '[Тестовая витрина](%s/)\n\nКоммит `%s` опубликован и проверен.\n' "$site" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
